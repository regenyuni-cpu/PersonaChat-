<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Persona Chat - Character AI</title><meta name="theme-color" content="#c85a32"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="icon.svg"><link rel="alternate icon" href="favicon.ico"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="PersonaChat">
<link rel="stylesheet" href="style.css"></head><body>
<aside id="side">
<div class="brand"><div class="logo" id="logo"></div><div class="t"><b>Persona Chat</b><small>Character AI Engine</small></div><button id="col" aria-label="Collapse sidebar"></button></div>
<div class="sp"><button class="btn pr" id="newc"></button><button class="btn" id="forge"></button></div>
<div class="srch" id="srch"><input id="q" placeholder="Search characters…"></div>
<div id="list"></div>
<div class="me"><div class="av sm" id="mav" style="background:#c85a32"></div><div class="cn"><b id="mn">You</b></div><button id="sw" class="mu">Switch</button></div>
</aside>
<section id="main">
<div id="head"><button id="open" aria-label="Open sidebar"></button><div class="av" id="hav" style="width:50px;height:50px"></div><div class="t"><div class="r1"><b id="hn"></b><span class="bd o" id="hb"></span></div><small id="ht"></small></div>
<button id="gk" title="Gemini key"></button><button id="rew" title="Rewind last exchange"></button><button id="pal" title="Change accent colour"></button><button id="sunb" title="Light / dark"></button><button id="det"></button></div>
<div id="msgs"></div>
<div id="acts"></div>
<div id="bar"><textarea id="inp" rows="1"></textarea><button id="send" aria-label="Send"></button></div>
</section>
<aside id="dr"><div id="drb"></div></aside>
<div class="ov" id="ov"><div class="md" id="md"></div></div><div id="toast"></div>
<script src="script.js"></script></body></html>
